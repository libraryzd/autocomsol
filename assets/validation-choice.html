<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoCOMSOL · 选择进一步验证</title>
<style>
  :root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#162d40;background:#f3f6f8}
  body{max-width:720px;margin:48px auto;padding:0 20px}
  main{background:white;padding:30px;border:1px solid #d8e2e8;border-radius:14px}
  h1{font-size:25px;margin-top:0} p{line-height:1.65;color:#486071}
  fieldset{border:0;padding:0;margin:22px 0}legend{font-weight:650;margin-bottom:12px}
  .choice{display:block;padding:16px;margin:10px 0;border:1px solid #ccd9e2;border-radius:8px;cursor:pointer}
  .choice:has(input:checked){background:#eaf6f4;border-color:#168276}
  input[type=checkbox]{width:19px;height:19px;vertical-align:middle;margin-right:10px;accent-color:#168276}
  small{display:block;margin:7px 0 0 33px;color:#486071;line-height:1.5}
  input[type=text],textarea{box-sizing:border-box;width:100%;font:inherit;padding:10px;border:1px solid #9eafb9;border-radius:6px;margin-top:8px}
  button{font:inherit;border:0;border-radius:7px;background:#126e65;color:white;padding:12px 18px;cursor:pointer;margin:5px 8px 5px 0}
  button.secondary{background:#e6edf1;color:#162d40}
  :focus-visible{outline:3px solid #efad27;outline-offset:3px}
  #result{margin-top:22px}textarea{height:116px;resize:vertical}#feedback{min-height:24px}
</style>
<main>
  <h1>模型已跑通，选择进一步验证</h1>
  <p>可选任意一项或多项。也可全部不选，使用已跑通的模型继续提取结果、绘图和交付。</p>
  <form id="choices">
    <label for="runId">任务 / 基线运行编号</label>
    <!-- Fill the value with the actual baseline run ID in the task copy. -->
    <input id="runId" type="text" required placeholder="填写此次模型的运行编号" autocomplete="off">
    <fieldset>
      <legend>进一步验证（可多选）</legend>
      <label class="choice"><input id="mesh" type="checkbox">网格验证
        <small>规划粗、中、精三档；以精档为参照，粗、中档关键结果差异均须小于 3%。未达标则重新规划。</small></label>
      <label class="choice"><input id="tolerance" type="checkbox">容差（相对容差）验证
        <small>规划宽松、中等、严格三档；以严格档为参照，另外两档关键结果差异均须小于 3%。未达标则重新规划。</small></label>
      <label class="choice"><input id="reference" type="checkbox">算例验证
        <small>优先使用已上传文献；没有资料时，再由你上传或明确要求联网查找。</small></label>
    </fieldset>
    <button type="submit">生成我的选择</button>
    <button type="button" id="skip" class="secondary">不进行进一步验证</button>
  </form>
  <section id="result" hidden>
    <label for="message">将以下文字发送到原 Codex 聊天后，才会开始执行：</label>
    <textarea id="message" readonly></textarea>
    <button type="button" id="copy">复制选择</button>
    <p id="feedback" role="status" aria-live="polite"></p>
  </section>
  <p>此表单在本地运行，不会上传资料，也不会调用 MATLAB。已有选项变更后，请重新生成并发送选择。</p>
</main>
<script>
  const form = document.getElementById('choices');
  const runId = document.getElementById('runId');
  const result = document.getElementById('result');
  const message = document.getElementById('message');
  const feedback = document.getElementById('feedback');
  const studies = [
    ['mesh', '网格验证'], ['tolerance', '容差（相对容差）验证'], ['reference', '算例验证']
  ];
  function selectionMessage(id, selected) {
    const prefix = '对于基线运行 ' + id.trim() + '，';
    return selected.length
      ? prefix + '我选择：' + selected.join('、') + '。仅进行这些验证，未选择的验证跳过。'
      : prefix + '不进行进一步验证。请使用已经跑通的模型继续任务。';
  }
  function generate() {
    if (!runId.value.trim()) { runId.focus(); return; }
    const selected = studies.filter(([id]) => document.getElementById(id).checked).map(([, label]) => label);
    message.value = selectionMessage(runId.value, selected);
    result.hidden = false;
    feedback.textContent = '选择尚未发送，请复制到原聊天。';
  }
  form.addEventListener('submit', event => { event.preventDefault(); generate(); });
  form.addEventListener('input', () => { result.hidden = true; message.value = ''; });
  document.getElementById('skip').addEventListener('click', () => {
    if (!runId.value.trim()) { runId.focus(); return; }
    studies.forEach(([id]) => { document.getElementById(id).checked = false; });
    generate();
  });
  document.getElementById('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(message.value);
      feedback.textContent = '已复制。请粘贴并发送到原 Codex 聊天。';
    } catch {
      message.focus(); message.select();
      feedback.textContent = '浏览器未允许自动复制。文字已选中，请按 Ctrl+C 复制。';
    }
  });
</script>
</html>
